<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    background: linear-gradient(180deg, #050a1a 0%, #0c1a3a 32%, #22365e 55%, #4b5480 74%, #7c6a94 88%, #a8819b 100%);
    min-height: 100vh;
  }

  /* ---------- night scenery ---------- */
  .scene { position: fixed; inset: 0; overflow: hidden; }
  .moon {
    position: absolute; top: 8%; right: 13%; width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #ffffff, #dbe4f5 55%, #aebbda 85%);
    box-shadow: 0 0 40px 10px rgba(200, 210, 245, .5), 0 0 120px 50px rgba(160, 170, 230, .22);
    animation: moonIn 1.2s ease-out both;
  }
  .moon::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 60%, rgba(150,160,200,.5) 0 8px, transparent 9px),
      radial-gradient(circle at 65% 40%, rgba(150,160,200,.45) 0 6px, transparent 7px),
      radial-gradient(circle at 55% 72%, rgba(150,160,200,.4) 0 10px, transparent 11px);
  }
  .moon::after {
    content: ""; position: absolute; inset: -26px; border-radius: 50%;
    border: 2px solid rgba(200, 215, 255, .28);
  }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle 3s ease-in-out infinite;
  }
  .cloud { position: absolute; background: #2c3d5e; border-radius: 999px; opacity: .85; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #2c3d5e; border-radius: 50%; }
  .c1 { top: 11%; left: -180px; width: 170px; height: 46px; animation: drift 38s linear infinite; }
  .c1::before { width: 70px; height: 70px; top: -32px; left: 22px; }
  .c1::after { width: 52px; height: 52px; top: -22px; left: 78px; }
  .c2 { top: 23%; left: -260px; width: 220px; height: 56px; opacity: .65; animation: drift 55s linear infinite 6s; }
  .c2::before { width: 90px; height: 90px; top: -42px; left: 30px; }
  .c2::after { width: 64px; height: 64px; top: -28px; left: 104px; }
  .c3 { top: 5%; left: -140px; width: 130px; height: 38px; opacity: .5; animation: drift 70s linear infinite 12s; }
  .c3::before { width: 56px; height: 56px; top: -26px; left: 18px; }
  .c3::after { width: 42px; height: 42px; top: -18px; left: 62px; }
  .c4 { top: 32%; left: -200px; width: 150px; height: 42px; opacity: .45; animation: drift 64s linear infinite 20s; }
  .c4::before { width: 62px; height: 62px; top: -28px; left: 24px; }
  .c4::after { width: 46px; height: 46px; top: -20px; left: 74px; }

  .mountains { position: absolute; bottom: 0; left: 0; width: 100%; height: 72%; }
  .mountains svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
  .haze { animation: rise 1.2s ease-out both; opacity: .85; filter: blur(2px); }
  .far  { animation: rise 1s ease-out both .1s; }
  .mid  { animation: rise 1s ease-out both .25s; }
  .near { animation: rise 1s ease-out both .4s; }
  .mist {
    position: absolute; bottom: 30%; left: -20%; width: 140%; height: 70px;
    background: linear-gradient(90deg, transparent, rgba(200,210,240,.35) 20%, rgba(200,210,240,.35) 80%, transparent);
    filter: blur(14px); animation: mistSlide 16s ease-in-out infinite alternate;
  }
  .mote {
    position: absolute; bottom: -10px; border-radius: 50%;
    background: radial-gradient(circle, #ffedb0, rgba(255,237,176,0));
    animation: floatUp linear infinite;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 50%, rgba(4, 8, 20, .4) 100%);
  }

  /* ---------- slide-down panel ---------- */
  .shade { position: fixed; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding-top: 7vh; }
  .panel {
    width: min(600px, calc(100vw - 48px));
    background: rgba(255, 255, 255, .96);
    border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 4px 18px rgba(0, 0, 0, .35);
    border: 1px solid rgba(255, 255, 255, .9);
    outline: 6px solid rgba(255, 255, 255, .22);
    text-align: center;
    padding: 40px 40px 32px;
    color: #1e3a5f;
    transform: translateY(-120%);
    animation: slideDown 1s cubic-bezier(.2, 1.4, .35, 1) .15s forwards;
  }
  .cord { width: 6px; height: 7vh; min-height: 40px; margin: 0 auto; background: linear-gradient(#5a7194, #9fb4d4); border-radius: 0 0 4px 4px; }
  .panel-wrap { transform: translateY(-120%); animation: slideDown 1s cubic-bezier(.2, 1.4, .35, 1) .15s forwards; display: flex; flex-direction: column; align-items: center; }

  .badge {
    width: 84px; height: 84px; margin: 0 auto; border-radius: 50%;
    background: linear-gradient(145deg, #ff6b6b, #e63e3e);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 28px rgba(230, 62, 62, .4), inset 0 2px 6px rgba(255,255,255,.5);
    animation: pop .6s cubic-bezier(.2, 1.6, .4, 1) .9s both;
  }
  .badge svg { width: 44px; height: 44px; }
  h1 { font-size: 34px; margin: 16px 0 6px; letter-spacing: .2px; color: #16324f; animation: fadeUp .6s ease-out 1s both; }
  .sub { color: #5b7a99; font-size: 15px; line-height: 1.55; animation: fadeUp .6s ease-out 1.1s both; }
  .url-box {
    flex: 1; background: #f1f7fd; border: 1px solid #cfe3f5;
    border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #d33;
    word-break: break-all; max-width: 100%; text-align: left;
    user-select: text; -webkit-user-select: text; cursor: text;
    animation: fadeUp .6s ease-out 1.2s both;
  }
  .copy-row { display: flex; gap: 8px; align-items: stretch; margin-top: 18px; }
  .copy-btn {
    flex-shrink: 0; border: 1px solid #b9d4ea; background: #2f6cb8; color: #fff;
    border-radius: 12px; padding: 0 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    animation: fadeUp .6s ease-out 1.25s both;
  }
  .copy-btn:hover { background: #255a9c; }
  .copy-btn.copied { background: #2e9e5b; border-color: #2e9e5b; }
  .meta { margin-top: 12px; font-size: 12px; color: #8aa2b8; animation: fadeUp .6s ease-out 1.3s both; }
  .meta:empty { display: none; }

  @keyframes slideDown { to { transform: translateY(0); } }
  @keyframes rise { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeUp { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes moonIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes drift { to { transform: translateX(calc(100vw + 320px)); } }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes mistSlide { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
  @keyframes floatUp {
    0% { transform: translate(0, 0); opacity: 0; }
    12% { opacity: .9; }
    100% { transform: translate(4vw, -72vh); opacity: 0; }
  }

  @media (max-height: 640px) { .shade { padding-top: 3vh; } .panel { padding: 28px 28px 24px; } h1 { font-size: 26px; } }
  /* Deliberately NO "Go back" / "Proceed" button: there is nothing to click off. */
</style>
